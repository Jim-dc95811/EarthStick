name: Publish EarthStick package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack exact staged project files
        run: |
          unzip -o _earthstick_payload.zip
          rm _earthstick_payload.zip
          rm .github/workflows/unpack.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit finished repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish EarthStick v0.5 project package"
          git push
