name: Publish EarthStick package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact tested v0.5 root files
        run: |
          unzip -o releases/EarthStick_v0.5.zip -d .
          rm -f _earthstick_payload.zip _trigger.txt
          rm .github/workflows/unpack.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit finished root package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore exact EarthStick v0.5 root files"
          git push
